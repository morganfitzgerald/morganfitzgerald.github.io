# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Morgan Fitzgerald"
email: "mofitzgerald@ucsd.edu"
description: >-
  Cognitive Neuroscience PhD Candidate at UC San Diego.
  I study physiological signals that accompany cognitive state — disentangling
  cardiac and neural contributions to understand attention, memory, and arousal.
twitter_username: ""
github_username: morganfitzgerald
minimal_mistakes_skin: default
search: true


# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Morgan Fitzgerald"
  avatar : "/assets/images/Headshot__brown-sweater__office__professional.png"
  bio    : "PhD candidate in cognitive neuroscience studying physiological signals of cognitive state, heart-brain coupling, and scalable cardiac analysis with PyHEARTS."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/morganfitzgerald"
    - label: "Voytek Lab"
      icon: "fas fa-fw fa-link"
      url: "https://voyteklab.com/"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:mofitzgerald@ucsd.edu"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/morganfitzgerald"
    - label: "Voytek Lab"
      icon: "fas fa-fw fa-link"
      url: "https://voyteklab.com/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "assets/css"
    values:
      css: "custom.css"

feature_row_projects:
  - image_path: /assets/images/hormone-1f-framework.svg
    title: "Physiological Signals & Cognitive State"
    excerpt: "MEG study linking hormones and autonomic physiology to neural dynamics — quantifying how arousal and endocrine state shape cortical activity."
    url: "/projects/#hormones-1f-dynamics"
    btn_label: "View Project"
    btn_class: "btn--primary"

  - image_path: /assets/images/heart-param.jpg
    title: "PyHEARTS — Cardiac Analysis at Scale"
    excerpt: "Open-source beat-to-beat ECG toolbox validated across 30,000+ individuals — built to disentangle cardiac from neural contributions in physiological data."
    url: "/projects/#pyhearts"
    btn_label: "View Project"
    btn_class: "btn--primary"

  - image_path: /assets/images/heart-param.jpg
    title: "Open-Source & Pipelines"
    excerpt: "Co-developer of PyHEARTS and builder of documented, reproducible pipelines for large-scale physiological datasets."
    url: "https://github.com/PyHEARTS-toolbox/pyhearts"
    btn_label: "GitHub"
    btn_class: "btn--primary"



category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
