<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Analysis framework linking hormones to neural and heart-brain signals</title>
  <desc id="desc">Hormone levels relate to background brain activity and the brain response to the heartbeat, and those two brain measures may change together.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5560"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f68"/>
    </marker>
    <style>
      .title { font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 700; fill: #2857A7; }
      .box-title { font-family: Georgia, "Times New Roman", serif; font-size: 14.5px; font-weight: 700; }
      .box-sub { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #5a6570; }
      .side-title { font-family: Georgia, "Times New Roman", serif; font-size: 14px; font-weight: 700; fill: #2857A7; }
      .side-item { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #3a4654; }
      .key-title { font-family: Georgia, "Times New Roman", serif; font-size: 13.5px; font-weight: 700; fill: #2857A7; }
      .key-item { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; fill: #3a4654; }
      .cochange { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #4a5560; }
    </style>
  </defs>

  <rect width="760" height="420" fill="#f7f8fa"/>

  <text class="title" x="40" y="42">Analysis framework</text>

  <!-- Hormone box (peripheral) -->
  <rect x="40" y="145" width="170" height="78" rx="12" fill="#d9ebe8" stroke="#2f6f68" stroke-width="2"/>
  <text class="box-title" x="125" y="178" text-anchor="middle" fill="#2f6f68">Hormone levels</text>
  <text class="box-sub" x="125" y="200" text-anchor="middle">estradiol and related</text>
  <text class="box-sub" x="125" y="216" text-anchor="middle">endocrine signals</text>

  <!-- Neural box -->
  <rect x="300" y="70" width="210" height="84" rx="12" fill="#d6e2f2" stroke="#2857A7" stroke-width="2"/>
  <text class="box-title" x="405" y="102" text-anchor="middle" fill="#2857A7">Background brain activity</text>
  <text class="box-sub" x="405" y="124" text-anchor="middle">aperiodic / 1/f patterns</text>
  <text class="box-sub" x="405" y="140" text-anchor="middle">(slope and overall level)</text>

  <!-- Heart-brain box -->
  <rect x="300" y="220" width="210" height="84" rx="12" fill="#e4eaf4" stroke="#2857A7" stroke-width="2"/>
  <text class="box-title" x="405" y="252" text-anchor="middle" fill="#2857A7">Brain response to heartbeat</text>
  <text class="box-sub" x="405" y="274" text-anchor="middle">cardiac-evoked brain signals</text>
  <text class="box-sub" x="405" y="290" text-anchor="middle">(timing and strength)</text>

  <!-- Arrows from hormone -->
  <path d="M 210 170 C 250 150, 270 130, 300 112" fill="none" stroke="#2f6f68" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
  <path d="M 210 200 C 250 220, 270 245, 300 262" fill="none" stroke="#2f6f68" stroke-width="2.2" marker-end="url(#arrow-teal)"/>

  <!-- Co-change double arrow -->
  <line x1="405" y1="154" x2="405" y2="220" stroke="#4a5560" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="cochange" x="418" y="192">co-change?</text>

  <!-- Right panel: questions -->
  <text class="side-title" x="560" y="88">What we asked</text>
  <text class="side-item" x="560" y="118">1. Do hormones track with</text>
  <text class="side-item" x="575" y="138">background brain activity?</text>
  <text class="side-item" x="560" y="168">2. Do hormones track with</text>
  <text class="side-item" x="575" y="188">brain responses to the heart?</text>
  <text class="side-item" x="560" y="218">3. Do those two brain signals</text>
  <text class="side-item" x="575" y="238">tend to move together?</text>
  <text class="side-item" x="560" y="268">4. If so, is the link direct,</text>
  <text class="side-item" x="575" y="288">or shared through hormones?</text>

  <!-- Key points -->
  <text class="key-title" x="40" y="345">In plain terms</text>
  <text class="key-item" x="40" y="370">Multi-session MEG with within-person hormone changes</text>
  <text class="key-item" x="40" y="390">Separate shared changes from hormone-linked effects</text>
  <text class="key-item" x="420" y="370">Focus on cognitive-relevant physiology</text>
  <text class="key-item" x="420" y="390">Heart signals treated as both signal and contamination</text>
</svg>
